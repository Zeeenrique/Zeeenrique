<svg xmlns="http://www.w3.org/2000/svg" width="860" height="294" viewBox="0 0 860 294" role="img" aria-label="Terminal: luiz henrique — dev full stack @ são miguel do oeste/sc; codando há 8 anos, load average: café, deploy, café; carreto/  xucrutz/   # privados, por enquanto; positivo. sim, tem planilha pra isso.; 2.732  # idle não é parado">
<style>
  .cmd{font:600 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#0f9d63}
