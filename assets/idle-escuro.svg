<svg xmlns="http://www.w3.org/2000/svg" width="860" height="440" viewBox="0 0 860 440" role="img" aria-label="Zeeenrique Idle: Luiz Henrique, prestígio 8, 3 contribuições no último ano">
<style>
  .rot{font:700 10px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#8e96a5;letter-spacing:1.2px}
  .val{font:700 20px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8ecf3}
  .mini{font:10px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8e96a5}
  .sub{font:12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8e96a5}
  .lang{font:600 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#e8ecf3}
  .nv{font:700 12px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#3ddc97}
  .chip{font:600 12px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#ffcf4a}
  .nome{font:800 24px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8ecf3}
  .tit{font:14px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#8e96a5}
  .sec{font:700 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#3ddc97;letter-spacing:2px}
  .big{font:800 40px -apple-system,'Segoe UI',Helvetica,Arial,sans-serif;fill:#e8ecf3}
  .rate{font:700 14px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#3ddc97}
  .pop{font:700 11px ui-monospace,SFMono-Regular,'SF Mono',Menlo,Consolas,monospace;fill:#ffcf4a;opacity:0;animation:pop 3.3s ease-out infinite}
  .anel{transform-box:fill-box;transform-origin:center;animation:anel 2.2s ease-out infinite}
  .in{animation:in .5s ease-out backwards}
  .barra{transform-box:fill-box;transform-origin:left;animation:enche .9s cubic-bezier(.2,.8,.2,1) backwards}
  .prog{transform-box:fill-box;transform-origin:left;animation:enche 1.4s .3s cubic-bezier(.2,.8,.2,1) backwards}
  .pulso{animation:pulso 2.4s ease-in-out infinite}
  @keyframes in{from{opacity:0;transform:translateY(6px)}}
  @keyframes enche{from{transform:scaleX(0)}}
  @keyframes pulso{50%{opacity:.35}}
  @keyframes pop{0%{opacity:0;transform:translateY(0)}10%{opacity:1}60%{opacity:0;transform:translateY(-34px)}100%{opacity:0}}
  @keyframes anel{from{opacity:.7;transform:scale(1)}to{opacity:0;transform:scale(1.25)}}
  @media (prefers-reduced-motion:reduce){.in,.barra,.prog,.pulso,.anel{animation:none}.pop{display:none}}
</style>
<defs><clipPath id="av"><circle cx="102" cy="118" r="56"/></clipPath></defs>
