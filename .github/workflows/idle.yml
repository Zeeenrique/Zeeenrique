name: idle

on:
  schedule:
    - cron: '23 9 * * *' # 06:23 em Brasília
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/**']

permissions:
  contents: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/gerar.mjs
        env:
          # STATS_TOKEN (PAT só leitura) enxerga os repos privados; sem ele usa o token padrão
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add assets README.md
          git diff --cached --quiet || git commit -m 'chore: jogo salvo'
          git push
