name: ponto

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

concurrency:
  group: readme
  cancel-in-progress: false

jobs:
  bate-ponto:
    if: contains(github.event.issue.title, 'ponto') || contains(github.event.issue.title, '👋') || contains(github.event.issue.title, 'oi')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: registra no livro de ponto
        env:
          LOGIN: ${{ github.event.issue.user.login }}
        run: node scripts/ponto.mjs
      - run: node scripts/gerar.mjs
        env:
          GH_TOKEN: ${{ secrets.STATS_TOKEN || secrets.GITHUB_TOKEN }}
      - name: commit
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data assets README.md
          git diff --cached --quiet || git commit -m "chore: ponto batido"
          git pull --rebase
          git push
      - name: responde e fecha
        env:
          GH_TOKEN: ${{ github.token }}
          NUM: ${{ github.event.issue.number }}
          LOGIN: ${{ github.event.issue.user.login }}
        run: |
          gh issue comment "$NUM" --repo "$GITHUB_REPOSITORY" --body "Ponto registrado, @$LOGIN 🕐 Teu crachá já tá no livro de ponto da fábrica!"
          gh issue close "$NUM" --repo "$GITHUB_REPOSITORY"
